<!DOCTYPE html>
<html>
<head>
    <title>Student Toolkit</title>
    <link rel="stylesheet"
    href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1>🎓 Student Toolkit</h1>
    <p>Your simple study companion.</p>

    <h2>📚 Study Planner</h2>
    <button>Open Planner</button>

    <h2>⏱️ Study Timer</h2>
    <div id="timer">25:00</div>div>
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
    <h2>📝 Quick Notes</h2>
<textarea id="notes" placeholder="Write your notes here..."></textarea>
<br><br>
<button onclick="saveNotes()">Save Notes</button>
<button onclick="clearNotes()">Clear Notes</button>

    <h2>🤖 AI Study Helper</h2>
    <button>Ask AI</button>
</body>
</html>
